<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aion Career Splash</title>
  <link rel="stylesheet" href="styles.css" />
  <script defer src="script.js"></script>
</head>
<body class="splash-page">
  <div class="splash-screen">
    <div class="video-wrapper">
      <video class="splash-video" autoplay muted playsinline loop>
        <source src="splash-video.mp4" type="video/mp4" />
      </video>
    </div>
    <div class="splash-overlay">
      <div class="splash-title">AION CAREER</div>
      <div class="splash-subtitle">Launch Your Journey</div>
      <div class="splash-note">Loading the recruitment experience...</div>
    </div>
  </div>
</body>
</html>
